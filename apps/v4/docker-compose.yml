
services:
  v4-app:
    build:
      context: ../..  # Build from ui root directory
      dockerfile: apps/v4/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Uncomment the following lines if you need persistent storage
    # volumes:
    #   - app-data:/app/data
    
    # Uncomment to add environment variables from file
    # env_file:
    #   - .env.local

# Uncomment if using volumes
# volumes:
#   app-data: